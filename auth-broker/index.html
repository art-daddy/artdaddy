<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sign in — ArtDaddy</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #e5e5e5;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #app {
        width: 100%;
        max-width: 420px;
        padding: 24px;
      }
      #message {
        text-align: center;
        color: #a3a3a3;
      }
      #message.error {
        color: #f87171;
      }
      #handoff {
        margin-top: 16px;
        text-align: center;
      }
      #open {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #e5e5e5;
        color: #0a0a0a;
        font-weight: 600;
        text-decoration: none;
      }
      #handoff .note {
        margin: 14px 0 0;
        color: #a3a3a3;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <p id="message">Loading…</p>
      <div id="sign-in"></div>
      <div id="handoff" hidden>
        <a id="open" href="#">Open ArtDaddy</a>
        <p class="note">
          This link works for about two minutes. After that, go back to ArtDaddy and choose “Log in or sign up” again.
        </p>
      </div>
    </div>

    <script>
      // The desktop app cannot run Clerk at all inside its own webview (wrong origin for a
      // pk_live_ key) — this page IS the fix: a real browser at the real verified domain runs
      // Clerk normally, then hands a short-lived one-time code back to the app via a deep link.
      // See artdaddy-main/src/api/desktopAuth.ts and src-tauri/src/lib.rs (open_desktop_auth)
      // for the client half of this flow, and Akaru-main/src/akaru/server/desktop_auth.py for
      // the backend half.
      const CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYXJ0ZGFkZHkuYXBwJA";
      const API_BASE = "https://akaru-server.ambitioustree-4d826744.centralindia.azurecontainerapps.io";
      const DEEP_LINK_PREFIX = "artdaddy://auth/callback";
      // The one-time code in the link is good for 120 seconds from the moment the server issues it (the
      // server's AUTH_CODE_TTL_SECONDS). A button that offers a spent code is worse than none, so it is offered
      // for a little less than that.
      const CODE_WINDOW_MS = 110000;
      // The browser has by now either handed the link to the app or not, and the page cannot tell which.
      const HANDOFF_HELP_AFTER_MS = 1500;

      // The steps of getting signed in that this page reports (T-20), anonymously and through the public beacon:
      // an id of the try (the app names it in the address), a step, ok, and one reason from that step's own list.
      // Never a code, a state, a challenge or a token. Written down again on the server (analytics.py
      // AUTH_PAGE_STEPS) and held equal by a test that reads this file; the app reports the other steps.
      const PAGE_STEPS = {
        page: ["bad_link"],
        clerk: ["load_failed"],
        authorize: ["token", "network", "unavailable", "rejected"],
        handoff: [],
        reopen: [],
      };
      // Only an id of exactly this shape is used or passed on: anything else in the address is not echoed anywhere.
      const ATTEMPT = (() => {
        const value = new URLSearchParams(window.location.search).get("attempt") || "";
        return /^[A-Za-z0-9_-]{12}$/.test(value) ? value : "";
      })();

      // A report is a hint, never a dependency: it never throws, is never waited for, and respects the browser's
      // own Do Not Track signal, as the rest of the site does.
      function report(step, detail) {
        try {
          if (navigator.doNotTrack === "1" || window.doNotTrack === "1") return;
          if (!Object.prototype.hasOwnProperty.call(PAGE_STEPS, step)) return;
          const body = { event: "auth", source: "page", step: step };
          if (ATTEMPT) body.attempt = ATTEMPT;
          if (detail && typeof detail.ok === "boolean") body.ok = detail.ok;
          if (detail && PAGE_STEPS[step].indexOf(detail.reason) !== -1) body.reason = detail.reason;
          if (detail && (detail.mode === "sign_in" || detail.mode === "sign_up")) body.mode = detail.mode;
          const payload = JSON.stringify(body);
          // A plain-text body makes this a "simple" request: no preflight, and it survives the page closing.
          const sent =
            navigator.sendBeacon &&
            navigator.sendBeacon(`${API_BASE}/e`, new Blob([payload], { type: "text/plain;charset=UTF-8" }));
          if (!sent) fetch(`${API_BASE}/e`, { method: "POST", body: payload, mode: "no-cors", keepalive: true });
        } catch {
          /* a report that cannot be made is not worth a failed sign-in */
        }
      }

      const messageEl = document.getElementById("message");
      const signInEl = document.getElementById("sign-in");
      const handoffEl = document.getElementById("handoff");
      const openEl = document.getElementById("open");
      let authorizationInFlight = false;

      function showMessage(text, isError) {
        messageEl.textContent = text;
        messageEl.classList.toggle("error", Boolean(isError));
        messageEl.hidden = false;
      }

      function showAuth() {
        messageEl.hidden = true;
        signInEl.hidden = false;
      }

      // Hand the one-time code to the app. The page cannot tell whether the browser passed the link on (a browser
      // may ask first, may refuse a link that no click led to, and the app may not be registered), so it never
      // claims it did: it says what to do if the app did not open, and offers a button, which is also a click the
      // browser accepts where it refused the script's own navigation. The code is only worth offering for as long
      // as the server honours it.
      function handOff(code, state) {
        // The SAME state the app generated, never a new one — the app checks this matches
        // exactly before it will trust the code. The attempt's name goes back too, so the app reports the try
        // that actually finished even if the person pressed "Log in" a second time.
        const link =
          `${DEEP_LINK_PREFIX}?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state)}` +
          (ATTEMPT ? `&attempt=${ATTEMPT}` : "");
        showMessage("Signed in — returning you to ArtDaddy…");
        report("handoff");
        window.location.href = link;
        setTimeout(() => {
          showMessage("Signed in. ArtDaddy should open by itself. If it didn't, press the button below.");
          openEl.href = link;
          handoffEl.hidden = false;
        }, HANDOFF_HELP_AFTER_MS);
        setTimeout(() => {
          handoffEl.hidden = true;
          openEl.removeAttribute("href");
          showMessage("This sign-in link has expired. Go back to ArtDaddy and choose “Log in or sign up” again.", true);
        }, CODE_WINDOW_MS);
      }
      openEl.addEventListener("click", () => report("reopen"));

      async function completeAuthorization(clerk, codeChallenge, state) {
        if (authorizationInFlight) return;
        authorizationInFlight = true;
        signInEl.hidden = true;
        showMessage("Finishing sign-in…");
        let token;
        try {
          token = await clerk.session.getToken();
        } catch {
          authorizationInFlight = false;
          report("authorize", { ok: false, reason: "token" });
          showMessage("Sign-in could not be completed. Please return to the ArtDaddy app and try again.", true);
          return;
        }
        let res;
        try {
          res = await fetch(`${API_BASE}/auth/desktop/authorize`, {
            method: "POST",
            headers: { "content-type": "application/json", authorization: `Bearer ${token}` },
            body: JSON.stringify({
              code_challenge: codeChallenge,
              code_challenge_method: "S256",
              state: state,
            }),
          });
        } catch {
          authorizationInFlight = false;
          report("authorize", { ok: false, reason: "network" });
          showMessage("Couldn't reach the server. Check your connection and try again.", true);
          return;
        }
        if (res.status === 503) {
          authorizationInFlight = false;
          report("authorize", { ok: false, reason: "unavailable" });
          showMessage("The server is temporarily unavailable. Please try again in a moment.", true);
          return;
        }
        if (!res.ok) {
          authorizationInFlight = false;
          report("authorize", { ok: false, reason: "rejected" });
          showMessage("Sign-in could not be completed. Please return to the ArtDaddy app and try again.", true);
          return;
        }
        const body = await res.json();
        report("authorize", { ok: true });
        handOff(body.code, state);
      }

      async function main() {
        const params = new URLSearchParams(window.location.search);
        const codeChallenge = params.get("code_challenge");
        const codeChallengeMethod = params.get("code_challenge_method");
        const state = params.get("state");
        const mode = params.get("mode") === "sign-up" ? "sign-up" : "sign-in";
        if (!codeChallenge || !state || codeChallengeMethod !== "S256") {
          report("page", { ok: false, reason: "bad_link" });
          showMessage(
            "This sign-in link is missing required information. Please return to the ArtDaddy app and try again.",
            true,
          );
          return;
        }
        report("page", { ok: true, mode: mode === "sign-up" ? "sign_up" : "sign_in" });

        // Derive Clerk's Frontend API domain from the publishable key (the documented no-build
        // pattern) and load its UI bundle from there — no bundler, no build step.
        const fapi = atob(CLERK_PUBLISHABLE_KEY.split("_")[2]).slice(0, -1);
        await new Promise((resolve, reject) => {
          const ui = document.createElement("script");
          ui.src = `https://${fapi}/npm/@clerk/ui@1/dist/ui.browser.js`;
          ui.async = true;
          ui.crossOrigin = "anonymous";
          ui.onload = resolve;
          ui.onerror = () => reject(new Error("failed to load Clerk UI"));
          document.head.appendChild(ui);
        });
        await new Promise((resolve, reject) => {
          const sdk = document.createElement("script");
          // The browser bundle reads its key from THIS attribute and self-instantiates the
          // global `Clerk` singleton — `new Clerk(key)` is the separate npm/ESM API and throws
          // "Missing publishableKey" when used against this bundle instead.
          sdk.setAttribute("data-clerk-publishable-key", CLERK_PUBLISHABLE_KEY);
          sdk.src = `https://${fapi}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;
          sdk.async = true;
          sdk.crossOrigin = "anonymous";
          sdk.onload = resolve;
          sdk.onerror = () => reject(new Error("failed to load Clerk"));
          document.head.appendChild(sdk);
        });

        const clerk = window.Clerk;
        await clerk.load({ ui: { ClerkUI: window.__internal_ClerkUICtor } });

        if (clerk.session) {
          await completeAuthorization(clerk, codeChallenge, state);
          return;
        }

        showAuth();
        // Clerk owns the hash while rendering. The broker owns the mode query, but neither is
        // part of the desktop request that must survive every auth transition.
        const canonicalUrl = new URL(window.location.href);
        canonicalUrl.hash = "";
        canonicalUrl.searchParams.delete("mode");
        const brokerRequestUrl = canonicalUrl.toString();
        const signInUrl = new URL(brokerRequestUrl);
        signInUrl.searchParams.set("mode", "sign-in");
        const signUpUrl = new URL(brokerRequestUrl);
        signUpUrl.searchParams.set("mode", "sign-up");
        const redirectOptions = {
          routing: "hash",
          forceRedirectUrl: brokerRequestUrl,
          fallbackRedirectUrl: brokerRequestUrl,
        };
        if (mode === "sign-up") {
          document.title = "Sign up — ArtDaddy";
          clerk.mountSignUp(signInEl, {
            ...redirectOptions,
            signInUrl: signInUrl.toString(),
          });
        } else {
          clerk.mountSignIn(signInEl, {
            ...redirectOptions,
            signUpUrl: signUpUrl.toString(),
          });
        }
        clerk.addListener(({ session }) => {
          if (session) void completeAuthorization(clerk, codeChallenge, state);
        });
      }

      main().catch(() => {
        // Everything that can fail inside main() on its own is already answered where it happens; what reaches
        // here is the page itself not loading (Clerk's scripts, or Clerk starting).
        report("clerk", { ok: false, reason: "load_failed" });
        showMessage("Something went wrong loading sign-in. Please return to the ArtDaddy app and try again.", true);
      });
    </script>
  </body>
</html>
