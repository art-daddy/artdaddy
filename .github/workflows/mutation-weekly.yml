# The whole mutation run of the client, once a week (Stryker). A REPORT, never a gate: it cannot block a merge or a
# release. Line coverage says a line RAN; mutation testing breaks the code on purpose and checks that a test notices,
# so a surviving mutant is a bug the tests would let through. The run is heavy, so it lives here, on the free Linux
# runners of this public repository, and not on anybody's computer.
#
# Added 25 Nov 2026 at the owner's request. The first full run to get past Stryker's first pass (25 Nov, run
# 45652956328) was the measurement: in three jobs, the 9 files of `rest` were done in an hour, but after 5 h 30 min the
# timeline had tested 9% of its work and the tools 46%, so neither fitted GitHub's six-hour limit for a job. Every job
# also pays Stryker's first pass (each test once, in one thread: 9 to 17 minutes here) before its first mutant, and a
# mutant in code that runs at load time needs the whole suite, which is why `ignoreStatic` is on (stryker.ci.mjs).
#
# So the scope is cut into many shards that run side by side, each planned to test its mutants in no more than about
# four hours (stryker.ci.mjs; the files, and the parts of the biggest files, of each shard are in
# scripts/ci/mutationShards.json, sized from that run). The first job lists the shards from stryker.ci.mjs, so the list
# lives in one place; the last job puts their reports together and names any shard that sent none.
#
#   gh workflow run mutation-weekly.yml                                       the full run now
#   gh workflow run mutation-weekly.yml -f shard=tools-01                     one shard (its name, from stryker.ci.mjs)
#   gh workflow run mutation-weekly.yml -f shard=rest -f mutate=src/contract/clamp.ts   one file (minutes): a smoke test
name: Mutation (weekly)

on:
  schedule:
    # Sunday 20:00 UTC, which is Monday 01:30 in India: the report is ready when the week starts.
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      shard:
        description: "Which shard to run: all, or one name from stryker.ci.mjs (such as tools-01 or rest)"
        type: string
        default: all
      mutate:
        description: "Only mutate these files (a Stryker glob such as src/contract/clamp.ts). Empty: the whole shard."
        required: false
        default: ""

# The jobs only need to read the repository.
permissions:
  contents: read

concurrency:
  group: mutation-weekly
  cancel-in-progress: false

jobs:
  shards:
    name: Shards to run
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: list
        env:
          # Through the environment, never pasted into the script: the input is text typed by whoever starts the run.
          # Empty on a schedule, which runs every shard; a name that is not a shard stops the run here.
          WANTED: ${{ inputs.shard }}
        run: >-
          node --input-type=module -e 'const { shardsToRun } = await import("./stryker.ci.mjs");
          console.log("list=" + JSON.stringify(shardsToRun(process.env.WANTED)));' >> "$GITHUB_OUTPUT"

  mutation:
    name: Stryker (${{ matrix.shard }})
    needs: shards
    runs-on: ubuntu-22.04
    # GitHub stops any job at six hours. Each shard is planned at about four hours of mutants plus its setup and first
    # pass. If one does not fit, it is cancelled, writes no report, and the last job names it: that is the measurement,
    # and the answer is to give that shard's files to more shards (scripts/ci/mutationShards.json).
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shards.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Stryker
        env:
          MUTATION_SHARD: ${{ matrix.shard }}
          # Through the environment, never pasted into the script: the input is text typed by whoever starts the run.
          MUTATE: ${{ inputs.mutate }}
        run: |
          args=(stryker.ci.mjs)
          if [ -n "$MUTATE" ]; then args+=(--mutate "$MUTATE"); fi
          npx stryker run "${args[@]}"
      - name: Score of this shard, on the page of the run
        if: always()
        run: node scripts/ci/mutationSummary.mjs reports/mutation/mutation.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.shard }}
          path: reports/mutation/
          if-no-files-found: error
          retention-days: 60

  summary:
    name: Score of the whole run
    needs: [shards, mutation]
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      # The shards this run started: the summary names every one of them that sent no report.
      SHARDS: ${{ needs.shards.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: mutation-*
          path: reports/shards
      - name: All shards together, and the files to look at first
        run: node scripts/ci/mutationSummary.mjs --shards "$SHARDS" reports/shards/*/mutation.json
