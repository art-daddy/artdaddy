name: Isolated native preview seek

on:
  push:
    branches: [qa/preview-seek-20261014]
    paths:
      - .github/workflows/preview-seek.yml
      - scripts/qa/videoSeek.mjs
      - src/preview/videoSource.ts
      - e2e/ui/fixtures/mac-recording-preview.mp4
  workflow_dispatch:
    inputs:
      baseline:
        description: "Original decoder commit for the before/after pixel comparison"
        required: true
        default: "8e8de30af77effee1e0e640020a1b7a80196d08f"

jobs:
  preview:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/qa/videoSeek.mjs "$PREVIEW_BASELINE"
        env:
          PREVIEW_BASELINE: ${{ inputs.baseline || '8e8de30af77effee1e0e640020a1b7a80196d08f' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preview-seek-${{ matrix.runner }}
          path: test-results/video-seek/**
          if-no-files-found: error