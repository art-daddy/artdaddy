# Build and optionally publish the x86_64 Linux AppImage and Debian package.
#
# Ubuntu 22.04 is the compatibility floor: AppImages inherit the build host's glibc floor, so
# moving this to ubuntu-latest would silently stop the app running on older supported systems.
name: Linux build

on:
  workflow_dispatch:
    inputs:
      whisper_ref:
        description: "whisper.cpp tag to build"
        required: true
        default: "v1.9.2"
      publish:
        description: "Attach Linux bundles to the current version's GitHub release"
        type: boolean
        default: false
      enable_auto_update:
        description: "Sign the AppImage for auto-update (requires the existing updater key secret)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      TRIPLE: x86_64-unknown-linux-gnu
      VITE_API_BASE_URL: https://akaru-server.ambitioustree-4d826744.centralindia.azurecontainerapps.io
      # See macos-release.yml: without this the build ships with error reporting off.
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build and launch dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake curl ffmpeg file libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf squashfs-tools xvfb \
            gstreamer1.0-libav gstreamer1.0-plugins-bad gstreamer1.0-plugins-good

      - run: npm ci

      - name: Build portable whisper.cpp
        env:
          WHISPER_REF: ${{ inputs.whisper_ref }}
        run: |
          git clone --depth 1 --branch "$WHISPER_REF" https://github.com/ggml-org/whisper.cpp whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper.cpp/build --config Release -j"$(nproc)"
          BIN="$(find whisper.cpp/build -name whisper-cli -type f -perm -111 | head -n1)"
          test -n "$BIN" || { echo "::error::no whisper-cli was produced"; exit 1; }
          mkdir -p src-tauri/binaries
          cp "$BIN" "src-tauri/binaries/artdaddy-whisper-cli-${TRIPLE}"
          chmod +x "src-tauri/binaries/artdaddy-whisper-cli-${TRIPLE}"

      - name: Prove whisper is portable and transcribes
        run: |
          BIN="src-tauri/binaries/artdaddy-whisper-cli-${TRIPLE}"
          file "$BIN"
          ldd "$BIN"
          ! ldd "$BIN" | grep -q "not found" || {
            echo "::error::whisper-cli has an unresolved runtime library"
            exit 1
          }
          node scripts/smoke-whisper.mjs "$BIN"
          curl -fsSL -o tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin
          "$BIN" -m tiny.bin -f whisper.cpp/samples/jfk.wav -otxt -of result
          test -s result.txt || { echo "::error::whisper produced an empty transcript"; exit 1; }
          NORM="$(tr '[:upper:]' '[:lower:]' < result.txt | tr -cd 'a-z')"
          case "$NORM" in
            *asknotwhatyourcountry*) echo "whisper decoded the expected speech." ;;
            *) echo "::error::transcript did not contain the expected words"; cat result.txt; exit 1 ;;
          esac

      - name: Stage every Linux sidecar
        run: npm run fetch:sidecars

      - name: Prove ffmpeg and ffprobe produce a real artifact
        run: |
          FFMPEG="src-tauri/binaries/artdaddy-ffmpeg-${TRIPLE}"
          FFPROBE="src-tauri/binaries/artdaddy-ffprobe-${TRIPLE}"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i testsrc2=size=160x90:rate=5 \
            -t 1 -pix_fmt yuv420p probe.mp4
          test -s probe.mp4 || { echo "::error::ffmpeg produced no video"; exit 1; }
          DIMS="$("$FFPROBE" -v error -select_streams v:0 -show_entries stream=width,height \
            -of csv=s=x:p=0 probe.mp4)"
          test "$DIMS" = "160x90" || { echo "::error::ffprobe reported $DIMS"; exit 1; }

      - run: npm run build:sidecar
      - run: npm run build:mcpb
      - run: npm run bundle:browser

      - name: Install the bundled browser's Linux runtime dependencies
        run: npx playwright install-deps chromium

      - name: Build AppImage and Debian package
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ENABLE_AUTO_UPDATE: ${{ inputs.enable_auto_update }}
        run: |
          rm -rf dist
          if [ "$ENABLE_AUTO_UPDATE" = "true" ]; then
            test -n "$SIGNING_KEY" || {
              echo "::error::auto-update needs the TAURI_SIGNING_PRIVATE_KEY repository secret"
              exit 1
            }
            export TAURI_SIGNING_PRIVATE_KEY="$SIGNING_KEY"
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$SIGNING_PASSWORD"
            npx tauri build --bundles appimage,deb
          else
            npx tauri build --bundles appimage,deb \
              --config '{"bundle":{"createUpdaterArtifacts":false}}'
          fi

      # "The workflow sets the variable" is not evidence the bundle received it — mac shipped
      # with error reporting silently off for every release up to 0.13.1 and nothing failed.
      # dist/ is what tauri just embedded, so assert against that.
      - name: The bundle must carry the server + Sentry config
        run: |
          test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL is empty"; exit 1; }
          grep -rqF --include='*.js' "$VITE_API_BASE_URL" dist/assets || {
            echo "::error::the built bundle does not contain $VITE_API_BASE_URL"
            exit 1
          }
          test -n "$VITE_SENTRY_DSN" || { echo "::error::VITE_SENTRY_DSN is empty - linux would ship blind"; exit 1; }
          dsn_id="${VITE_SENTRY_DSN##*/}"
          grep -rqF --include='*.js' "$dsn_id" dist/assets || {
            echo "::error::the built bundle does not carry the Sentry DSN"
            exit 1
          }
          echo "  api base + sentry baked in (project $dsn_id)"

      - name: Verify and launch what users receive
        id: artifact
        run: |
          APPIMAGE="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | head -n1)"
          DEB="$(find src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | head -n1)"
          test -n "$APPIMAGE" && test -s "$APPIMAGE" || { echo "::error::no AppImage"; exit 1; }
          test -n "$DEB" && test -s "$DEB" || { echo "::error::no Debian package"; exit 1; }
          chmod +x "$APPIMAGE"
          rm -rf squashfs-root
          "$APPIMAGE" --appimage-extract >/dev/null
          for name in artdaddy-ffmpeg artdaddy-ffprobe artdaddy-yt-dlp artdaddy-whisper-cli artdaddy-browser; do
            FOUND="$(find squashfs-root -type f -name "$name" | head -n1)"
            test -n "$FOUND" || { echo "::error::$name is missing from the AppImage"; exit 1; }
            test -x "$FOUND" || { echo "::error::$name is not executable in the AppImage"; exit 1; }
          done
          SCRIPT="$(find squashfs-root -type f -path '*/resources/artdaddy-browser.mjs' | head -n1)"
          NODE="$(find squashfs-root -type f -name artdaddy-browser | head -n1)"
          test -n "$SCRIPT" || { echo "::error::browser script is missing"; exit 1; }
          BROWSER_RESULT="$("$NODE" "$SCRIPT" page --url https://example.com)"
          RESULT="$BROWSER_RESULT" node -e '
            const r = JSON.parse(process.env.RESULT);
            if (!r.ok || !/example domain/i.test(r.title || "")) process.exit(1);
            console.log(`bundled browser fetched: ${r.title}`);
          '
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a timeout 20s "$APPIMAGE" \
            >/tmp/artdaddy-linux.out 2>/tmp/artdaddy-linux.err
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "::error::AppImage exited during its 20 second launch gate (status $STATUS)"
            sed -n '1,80p' /tmp/artdaddy-linux.err
            exit 1
          fi
          echo "AppImage stayed alive for 20 seconds."

          mapfile -t DEB_BINS < <(dpkg-deb --fsys-tarfile "$DEB" | tar -tf - |
            sed -n -e 's#^\./usr/bin/##p' -e 's#^usr/bin/##p')
          test "${#DEB_BINS[@]}" -gt 0 || { echo "::error::Debian package has no executables"; exit 1; }
          for name in "${DEB_BINS[@]}"; do
            case "$name" in
              artdaddy|artdaddy-*) ;;
              *) echo "::error::Debian package claims generic /usr/bin/$name"; exit 1 ;;
            esac
          done
          FFMPEG_OWNER_BEFORE="$(dpkg-query -S /usr/bin/ffprobe)"
          sudo apt-get install -y "$DEB"
          test "$(dpkg-query -S /usr/bin/ffprobe)" = "$FFMPEG_OWNER_BEFORE" || {
            echo "::error::ArtDaddy replaced the distribution ffprobe"
            exit 1
          }
          set +e
          xvfb-run -a timeout 20s /usr/bin/artdaddy \
            >/tmp/artdaddy-deb.out 2>/tmp/artdaddy-deb.err
          STATUS=$?
          set -e
          if [ "$STATUS" -ne 124 ]; then
            echo "::error::installed Debian app exited during its 20 second launch gate (status $STATUS)"
            sed -n '1,80p' /tmp/artdaddy-deb.err
            exit 1
          fi
          echo "Installed Debian app stayed alive for 20 seconds."
          echo "appimage=$APPIMAGE" >> "$GITHUB_OUTPUT"
          echo "deb=$DEB" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: artdaddy-linux-x86_64
          path: |
            ${{ steps.artifact.outputs.appimage }}
            ${{ steps.artifact.outputs.deb }}
            ${{ steps.artifact.outputs.appimage }}.sig
          if-no-files-found: warn

      - name: Publish Linux assets to the existing GitHub release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE: ${{ steps.artifact.outputs.appimage }}
          DEB: ${{ steps.artifact.outputs.deb }}
          ENABLE_AUTO_UPDATE: ${{ inputs.enable_auto_update }}
        run: |
          SIG="${APPIMAGE}.sig"
          if [ "$ENABLE_AUTO_UPDATE" = "true" ]; then
            test -s "$SIG" || { echo "::error::signed AppImage has no .sig"; exit 1; }
          fi
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist yet - publish the Windows release first."
            exit 1
          fi
          cp "$APPIMAGE" /tmp/ArtDaddy-linux-x86_64.AppImage
          cp "$DEB" /tmp/ArtDaddy-linux-x86_64.deb
          ASSETS=(
            /tmp/ArtDaddy-linux-x86_64.AppImage
            /tmp/ArtDaddy-linux-x86_64.deb
          )
          if [ "$ENABLE_AUTO_UPDATE" = "true" ]; then
            cp "$SIG" /tmp/ArtDaddy-linux-x86_64.AppImage.sig
            ASSETS+=(/tmp/ArtDaddy-linux-x86_64.AppImage.sig)
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          for LOCAL in "${ASSETS[@]}"; do
            ASSET="$(basename "$LOCAL")"
            LOCAL="/tmp/$ASSET"
            URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$ASSET"
            CODE="$(curl -sL -o /dev/null -w '%{http_code}' -I "$URL")"
            REMOTE="$(curl -sIL "$URL" | awk 'tolower($1) ~ /^content-length/ {print $2}' | tail -1 | tr -d '\r')"
            SIZE="$(stat -c%s "$LOCAL")"
            test "$CODE" = "200" && test "$REMOTE" = "$SIZE" || {
              echo "::error::$ASSET verification failed: HTTP $CODE, remote=$REMOTE local=$SIZE"
              exit 1
            }
          done
          if [ "$ENABLE_AUTO_UPDATE" = "true" ]; then
            echo "::notice::Linux assets are signed and public. In art-daddy/akaru-landing run:"
            echo "::notice::npm run update:linux -- $VERSION /path/to/ArtDaddy-linux-x86_64.AppImage.sig"
            echo "::notice::then deploy that repository to enable Linux auto-update."
          else
            echo "::notice::Unsigned Linux first-install assets are public; auto-update remains disabled."
          fi
