name: Exporter Linux bounds QA

# Real-Linux evidence for the memory-bound exporter work (V2-D115, the budget of decoder threads, and V2-D116, 4K canvases on the streamed
# engine) on GitHub's standard Ubuntu runner (4 vCPU, about 16 GB), with every case run inside the same kernel-enforced 8 GiB cgroup the native
# recovery job uses (scripts/qa/exporterLinuxMemory.mjs), so the "8gb" class is held by the kernel and not by a promise.
#
# The code under test is PINNED in the matrix, never the head of this branch: a later commit here cannot change what a result means. This
# branch only carries the instrument (this file, the sampler, the extra cases, the verdict). Each leg runs its cases one after another and a case
# that fails does not stop the batch; the branch leg then fails the job unless every export finished and was verified, the base leg is a
# comparison and only has to leave a result for every case. The first case (social-portrait) doubles as the warm-up for a cold dev-server
# cache, a plausible (not proven) trigger of the one transient this harness is known for: the test page failing to load one of its own files
# from its web server. That failure is re-run once, with both logs kept.
on:
  push:
    branches: ["qa/linux-bounds-*"]
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases to run, space separated (empty: each leg's own list)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: exporter-linux-bounds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  instrument:
    name: instrument self-tests
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sampler, case merge, verdict and this workflow's own consistency
        run: node --test scripts/qa/linuxSampler.test.mjs scripts/qa/linuxBounds.test.mjs

  bounds:
    name: ${{ matrix.leg }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: branch-cc3b74a
            code: cc3b74ae03c8509a1fc318e310f7839479fcd9b0
            must_pass: true
            cases: "social-portrait hd60 seq1080-n24 seq1080-n30 layers1080x3 seq1440-n1 seq1440 seq4k-n1-ci seq4k-ci"
          - leg: base-369bf7b
            code: 369bf7b3b528edc3a5d34a10577f7045cb4729fa
            must_pass: false
            cases: "social-portrait hd60 seq1080-n24 seq1080-n30 layers1080x3 seq1440-n1 seq1440 seq4k-n1-ci seq4k-ci"
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      VITE_API_BASE_URL: http://127.0.0.1:9
      VITE_SENTRY_DSN: ""
      SENTRY_DSN: ""
      CARGO_BUILD_JOBS: "2"
      TAURI_CONFIG: '{"bundle":{"externalBin":["binaries/artdaddy-ffmpeg","binaries/artdaddy-ffprobe"],"resources":[]}}'
      CASES: ${{ inputs.cases || matrix.cases }}
      OUT: ${{ github.workspace }}/out
    steps:
      - name: Instrument (this commit)
        uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - name: Code under test (pinned)
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.code }}
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-on-failure: true
      - name: Linux native GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libssl-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb dbus-x11 xdg-utils desktop-file-utils
      - name: Install and stage the encoder
        working-directory: app
        run: |
          npm ci
          node scripts/fetch-sidecars.mjs --only ffmpeg,ffprobe
      - name: Add the scratch cases to the library, and refuse a case that does not exist
        working-directory: app
        run: node ../tools/scripts/qa/linuxBoundsCases.mjs scripts/qa/exporterPromiseCases.json
      - name: Machine
        run: |
          set +e
          mkdir -p "$OUT/logs"
          {
            echo "== os"; head -4 /etc/os-release
            echo "== kernel"; uname -a
            echo "== cpu"; lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket'
            echo "== memory"; free -m
            echo "== cgroup"; cat /proc/self/cgroup; stat -fc %T /sys/fs/cgroup
            echo "== disk"; df -h / /mnt
            echo "== tools"; node --version; cargo --version; rustc --version
            "$GITHUB_WORKSPACE/app/src-tauri/binaries/artdaddy-ffmpeg-x86_64-unknown-linux-gnu" -version | head -1
            echo "== systemd"; systemctl --version | head -1
            echo "== code under test"; git -C "$GITHUB_WORKSPACE/app" rev-parse HEAD
            echo "== instrument"; git -C "$GITHUB_WORKSPACE/tools" rev-parse HEAD
          } > "$OUT/hardware.txt" 2>&1
          cat "$OUT/hardware.txt"
      - name: Build the app once, so that no case spends its time compiling
        working-directory: app
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo build --manifest-path src-tauri/Cargo.toml
      - name: Run the cases inside the 8 GiB kernel cap
        working-directory: app
        run: |
          set +e
          status="$OUT/status.txt"
          read -ra cases <<< "$CASES"
          node ../tools/scripts/qa/linuxSampler.mjs "$OUT/memsamples.tsv" 10 $$ &
          sampler=$!
          trap 'kill $sampler 2>/dev/null' EXIT
          for c in "${cases[@]}"; do
            for attempt in 1 2; do
              log="$OUT/logs/$c.$attempt.log"
              t0=$(date +%s)
              echo "$(date '+%F %T') START case=$c attempt=$attempt profile=8gb cap=8GiB log=$log" >> "$status"
              ARTDADDY_QA_PROMISE_CASE="$c" ARTDADDY_QA_PROMISE_PROFILE=8gb timeout 55m node scripts/qa/exporterLinuxMemory.mjs > "$log" 2>&1
              code=$?
              echo "$(date '+%F %T') END case=$c attempt=$attempt exit=$code seconds=$(( $(date +%s) - t0 ))" >> "$status"
              if [ "$code" -ne 0 ] && [ "$attempt" -eq 1 ] && grep -q 'Failed to fetch dynamically imported module' "$log"; then continue; fi
              break
            done
          done
          echo "$(date '+%F %T') DONE" >> "$status"
          exit 0
      - name: Keep each stopped run's job ledger, then summarise
        if: always()
        working-directory: app
        run: |
          set +e
          for report in reports/qa/exporter/*/report.json; do
            [ -f "$report" ] || continue
            root=$(node -e 'try{process.stdout.write(String(JSON.parse(require("node:fs").readFileSync(process.argv[1],"utf8")).root||""))}catch{}' "$report")
            if [ -n "$root" ] && [ -f "$root/compiled-project/internals/jobs.json" ]; then cp "$root/compiled-project/internals/jobs.json" "$(dirname "$report")/jobs-ledger.json"; fi
          done
          node ../tools/scripts/qa/qaSummary.mjs > "$OUT/summary.txt" 2>&1
          cat "$OUT/summary.txt"
          { echo "### ${{ matrix.leg }}"; echo '```'; cat "$OUT/summary.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the actual outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-bounds-${{ matrix.leg }}-attempt-${{ github.run_attempt }}
          path: |
            app/reports/qa/exporter/**
            out/**
          if-no-files-found: warn
      - name: Every case has a result (on the branch leg, every export finished and was verified)
        working-directory: app
        env:
          MUST_PASS: ${{ matrix.must_pass }}
        run: |
          read -ra cases <<< "$CASES"
          args=(reports/qa/exporter "${cases[@]}")
          if [ "$MUST_PASS" = "true" ]; then args+=(--must-pass); fi
          node ../tools/scripts/qa/linuxBoundsVerdict.mjs "${args[@]}"
