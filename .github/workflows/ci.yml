# CI for the desktop client: fast unit gate on every push/PR + the Tauri/desktop
# BUILD gate that the local pre-push hook never ran (npm run build only compiles
# the web half). The `desktop` job compiles the Rust shell (build.rs validates
# tauri.conf.json + capabilities) and then produces the full bundle — so a broken
# Cargo.toml / lib.rs / capabilities/*.json / tauri.conf.json fails the PR, not a
# user. See ideas.md IDEA-CI-001 (F10).
name: CI

on:
  push:
    # qa/**: throwaway branches that run this whole workflow before anything reaches main
    # (deleted after each run). main itself is only ever pushed by its owner.
    branches: [main, "qa/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + unit tests
    strategy:
      fail-fast: false
      matrix:
        # macOS 15 is the image the release is built on; 26 is the newest, so what a user on the
        # newest macOS sees is tried on every push too. (macos-14 retired on 2026-11-02.)
        os: [windows-latest, macos-15, macos-26, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build # tsc --noEmit && vite build
      - run: npm test -- --maxWorkers=2 --reporter=default --reporter=json --outputFile=reports/qa/signoff/unit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signoff-unit-${{ matrix.os }}
          path: reports/qa/signoff/unit.json
          if-no-files-found: warn

  browser:
    name: real-browser UI + compositor pixels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-26, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      ARTDADDY_E2E_SKIP_SIDECARS: "whisper-cli,yt-dlp,artdaddy-browser"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # happy-dom has no WebGL and no layout, so the compositor's shaders and the
      # app's ability to boot at all are untested until this job runs them in a
      # real Chromium. See playwright.config.ts.
      # Installed with --no-save so the committed lockfile stays authoritative for
      # the app itself; move it into devDependencies once it earns a place there.
      - run: npm i --no-save @playwright/test@1.61.1
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/fetch-sidecars.mjs --only ffmpeg,ffprobe
      # The specs append their waits to ARTDADDY_TIMING_FILE (next step) as they run, and a recorder that does not
      # make the folder itself fails on the first one: the folder exists before any spec starts.
      - name: Folder for the browser results and times
        run: |
          node -e "require('node:fs').mkdirSync('reports/qa/browser', { recursive: true })"
      - name: Real browser UI and compositor pixels
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: reports/qa/browser/results.json
          # The waits the specs time with e2e/lib/timing (uploaded below with the rest of reports/qa/browser).
          ARTDADDY_TIMING_FILE: reports/qa/browser/timing.jsonl
        run: npm run e2e:ui -- --reporter=list,json
      # The browser waits against the lab PC's budgets. Report only (CI is set): these machines are too uneven to
      # block on, and the lab PC's nightly run is the check.
      - name: Browser timings against the lab budgets (report only)
        if: always() && hashFiles('reports/qa/browser/timing.jsonl') != ''
        shell: bash
        run: |
          node scripts/qa/timingBudgets.mjs compare reports/qa/browser/timing.jsonl --report reports/qa/browser/timing-report.txt
          { echo '```'; cat reports/qa/browser/timing-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # macOS CI runs a failed test again on a fresh page (src/test/browserRunPolicy.ts). A green run
      # that needed one is only honest if it says so: this lists those tests as warnings on the run.
      # Advisory: a bug in the report must not turn a lane red.
      - name: Report browser tests that passed only on a retry
        if: always()
        continue-on-error: true
        run: node scripts/ci/browserFlakeReport.mjs reports/qa/browser/results.json
      - name: Verify real failing-browser evidence capture
        run: node scripts/qa/browserFailureArtifacts.mjs
      - name: Preserve real browser results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exporter-browser-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            reports/qa/browser/**
            test-results/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signoff-browser-${{ matrix.os }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn

  # The export suite (vitest.smoke.config.ts: render, export, captions, presets, frames) against
  # the ffmpeg each platform's INSTALLER ships, on that platform. Every earlier run of this suite
  # used the Windows ffmpeg, so a mac- or Linux-only export failure could only be found by a
  # user. Under CI a sidecar the suite needs and cannot find FAILS the run (src/test/sidecars.ts)
  # instead of skipping, so a broken download cannot turn into a green, empty pass.
  exports:
    name: export suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":["binaries/artdaddy-ffmpeg","binaries/artdaddy-ffprobe"],"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: fetch sidecars
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch:sidecars
      # mac and Linux have no whisper prebuilt: their RELEASE workflows compile it, which is
      # ~10 minutes this per-push lane does not need. Everything else is the shipped set.
      - name: fetch sidecars (no whisper prebuilt on this OS)
        if: runner.os != 'Windows'
        run: node scripts/fetch-sidecars.mjs --only yt-dlp,ffmpeg,artdaddy-browser
      - run: npm run build:sidecar
      - run: npm run bundle:browser
      - name: the bundled browser's Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Native export fixture dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev
      - name: Compile the real native export fixture before case deadlines
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib --no-run
      - name: export suite (real ffmpeg)
        env:
          # The one sidecar this lane deliberately did not stage. Release lanes set nothing here.
          ARTDADDY_E2E_SKIP_SIDECARS: ${{ runner.os != 'Windows' && 'whisper-cli' || '' }}
        run: npx vitest run --config vitest.smoke.config.ts --maxWorkers=2 --reporter=default --reporter=json --outputFile=reports/qa/exporter/full-smoke.json
      - name: Preserve real export results and bounded synthetic failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exporter-smoke-${{ matrix.os }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: reports/qa/exporter/**
          if-no-files-found: warn

  # The Rust shell's unit tests on the platforms the `desktop` job never runs. Some behaviour is
  # Unix-only (the open-file limit every sidecar inherits, UJ-020) and had no test anywhere. This
  # compiles and tests; it bundles nothing. The output-write regression executes real pinned
  # ffmpeg; unrelated sidecars and generated resources only have to exist for build.rs.
  rust-unix:
    name: cargo test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: system libraries (Linux; the linux-release.yml set, less its bundling tools)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libayatana-appindicator3-dev libssl-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev gnome-keyring dbus-x11
      - name: Real pinned FFmpeg for native output-write regression
        run: node scripts/fetch-sidecars.mjs --only ffmpeg,ffprobe
      - name: Other stand-in sidecars and resources (build.rs only checks they exist)
        shell: bash
        run: |
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries src-tauri/resources/ms-playwright src-tauri/resources/node_modules
          for n in yt-dlp whisper-cli browser; do touch "src-tauri/binaries/artdaddy-$n-$triple"; done
          touch src-tauri/resources/artdaddy-browser.mjs src-tauri/resources/artdaddy.mcpb
          touch src-tauri/resources/ms-playwright/placeholder src-tauri/resources/node_modules/placeholder
      # The sign-in token tests use the REAL credential store. On Linux that is the Secret Service
      # over D-Bus, which a desktop session provides and a headless runner does not: give the
      # tests the same backend (an unlocked gnome-keyring on a session bus), never a skip.
      - name: cargo test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            dbus-run-session -- bash -c 'echo -n test | gnome-keyring-daemon --unlock >/dev/null && cargo test --locked --manifest-path src-tauri/Cargo.toml'
          else
            cargo test --locked --manifest-path src-tauri/Cargo.toml
          fi
      # ...and once with NO Secret Service at all, as on a Linux desktop without a keyring: sign-in
      # must fall back to a file only the user can read. The store looks once per process, so this
      # is its own run, pointed at a bus that does not exist.
      - name: cargo test (Linux with no keyring service)
        if: runner.os == 'Linux'
        run: |
          DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent/bus cargo test --locked --manifest-path src-tauri/Cargo.toml --lib \
            -- --ignored --exact tests::without_a_secret_service_the_session_lives_in_a_private_file

  desktop:
    name: tauri desktop build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Staged BEFORE the cargo gate below, not after. build.rs validates every `externalBin`
      # and resource path, so with these missing it fails on the first one
      # (`binaries\ffmpeg-...exe doesn't exist`) and never reaches the config it exists to check.
      # That stayed hidden while rust-cache kept the build script from re-running at all: the
      # gate passed by being SKIPPED, and the first capability change in months — which is
      # exactly what it is meant to catch — turned it red.
      - name: fetch sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch:sidecars
      - name: build node sidecar
        run: npm run build:sidecar
      - name: build MCP bundle
        run: npm run build:mcpb
      - name: bundle browser resources
        run: npm run bundle:browser
      # Reliable core gate: compiles the Rust shell AND validates tauri.conf.json +
      # capabilities via build.rs — catches the Cargo / scope / sidecar-wiring
      # breakage class. `--locked` forbids a silent Cargo.lock repair, so a drift between
      # Cargo.toml and the committed lockfile fails the PR instead of being papered over.
      - name: cargo build (rust + config/capability gate)
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      # The custom IPC command (`trash_path`) is the app's only recoverable delete.
      # Its unit tests live next to it so a regression fails the PR, not a user.
      - name: cargo test (trash_path)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: tauri build
        # A build GATE, not a release: no updater signature is wanted, and without the private key
        # (never given to a PR build) tauri wrote both installers and then exited 1 on
        # "A public key has been found, but no private key" - the job was red on every run.
        shell: bash
        run: npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

  # The tool contract, read-only. `codegen --check` fails when the authored catalog
  # (src/contract/catalog.json), its compiled identity (identity.json) or the frozen 0.21.5
  # snapshot disagree; it used to run only in the local pre-push hook. The server's generated
  # copies live in the server's private repository and are compared by that repository's CI,
  # against the client commit it pins: there is no server checkout here, and the job says so.
  contract:
    name: tool contract (codegen --check)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      ARTDADDY_SERVER_DIR: ${{ github.workspace }}/../no-server-checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: The catalog, its identity and the frozen 0.21.5 snapshot agree (read-only)
        run: |
          node scripts/codegen.mjs --check
          git diff --exit-code # the check never writes
          echo "::notice title=Tool contract::client half checked. The server's generated copies are compared by the server's CI (no server checkout in this repository's CI)."
      # The canary: change one tool description in a copy, without running codegen. The check must
      # turn red on it, or a green check above proves nothing.
      - name: A changed tool description without codegen turns the check red (canary)
        run: |
          canary="$RUNNER_TEMP/contract-canary"
          mkdir -p "$canary/scripts" "$canary/src/contract/legacy"
          cp scripts/codegen.mjs "$canary/scripts/"
          cp src/contract/catalog.json src/contract/identity.json "$canary/src/contract/"
          cp src/contract/legacy/0.21.5.json "$canary/src/contract/legacy/"
          node -e '
            const fs = require("fs");
            const file = process.argv[1];
            const text = fs.readFileSync(file, "utf8");
            const marker = "\"description\": \"";
            const at = text.indexOf(marker);
            if (at < 0) process.exit(2);
            fs.writeFileSync(file, text.slice(0, at + marker.length) + "Drift canary. " + text.slice(at + marker.length));
          ' "$canary/src/contract/catalog.json"
          if node "$canary/scripts/codegen.mjs" --check > "$canary/out.txt" 2>&1; then
            echo "::error title=Tool contract::codegen --check passed on a catalog changed without codegen, so it detects no drift"
            exit 1
          fi
          if ! grep -q "identity.json" "$canary/out.txt"; then
            cat "$canary/out.txt"
            echo "::error title=Tool contract::the canary failed, but not on the stale identity it should have found"
            exit 1
          fi
          echo "drift caught: $(cat "$canary/out.txt")"

  # Every commit of a push or pull request is scanned for secrets (gitleaks, pinned, its checksum
  # checked). Any finding fails the job, and findings are printed redacted: these logs are public.
  # A reviewed false positive goes into .gitleaksignore by its fingerprint.
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # every commit of the change is scanned
      - name: The change this run judges (its base and its head)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$(git rev-parse HEAD)}"
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "$head" 2>/dev/null || true)" # a new branch: what main does not have
          fi
          if [ "$base" = "$head" ]; then
            base="$(git rev-parse --verify --quiet "$head^" || true)"
          fi
          echo "CHANGE_BASE=$base" >> "$GITHUB_ENV"
          echo "CHANGE_HEAD=$head" >> "$GITHUB_ENV"
          echo "This run judges ${base:-the whole history}..$head"
      - name: No secret in this change (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $dir/gitleaks.tar.gz" | sha256sum --check --strict --quiet
          tar -xzf "$dir/gitleaks.tar.gz" -C "$dir" gitleaks
          scan() { "$dir/gitleaks" git "$@" --config .gitleaks.toml --redact=100 --no-banner --log-level error --exit-code 3; }
          # The canary: a commit holding a random token shaped like a GitHub one must be found with this
          # repository's settings, or a clean scan below proves nothing.
          canary="$dir/canary"
          git init -q "$canary"
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "$canary/planted.txt"
          git -C "$canary" add planted.txt
          git -C "$canary" -c user.name=canary -c user.email=canary@localhost commit -qm canary
          found=0
          scan "$canary" > /dev/null 2>&1 || found=$?
          if [ "$found" -ne 3 ]; then
            echo "::error title=Secret scan::gitleaks did not find the planted fake token (exit $found), so a clean scan proves nothing"
            exit 1
          fi
          if [ -n "$CHANGE_BASE" ]; then range="$CHANGE_BASE..$CHANGE_HEAD"; else range="$CHANGE_HEAD"; fi
          commits="$(git rev-list --count "$range")"
          code=0
          scan . --log-opts="$range" --report-format json --report-path "$dir/report.json" || code=$?
          n="$(jq length "$dir/report.json" 2>/dev/null || echo 0)"
          {
            echo "### Secret scan (gitleaks $GITLEAKS_VERSION)"
            echo
            echo "$commits commits scanned ($range): $n findings. The planted fake token was found."
            if [ "$n" -gt 0 ]; then
              echo
              echo "| Rule | File | Line | Commit | Fingerprint |"
              echo "| --- | --- | --- | --- | --- |"
              jq -r '.[] | "| \(.RuleID) | \(.File) | \(.StartLine) | \(.Commit[0:12]) | `\(.Fingerprint)` |"' "$dir/report.json"
              echo
              echo "A secret in a commit stays in git history: rotate it first. A reviewed false positive goes into .gitleaksignore by its fingerprint, with the owner's review."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          case "$code" in
            0) echo "no secret in the $commits commits of $range" ;;
            3) echo "::error title=Secret in this change::gitleaks found $n secrets in $range (redacted; see the job summary)"; exit 1 ;;
            *) echo "::error title=Secret scan::gitleaks could not scan $range (exit $code)"; exit 1 ;;
          esac

  # Known vulnerabilities in the app's libraries (npm). Every advisory is reported, with whether it is
  # in a shipped library or only a development one; a new advisory on a library nobody touched never
  # turns a run red. A change fails only when it adds or moves a library that has a HIGH or CRITICAL
  # advisory of its own (scripts/ci/libraryAudit.mjs compares the change's lockfile with its base's).
  libraries:
    name: library audit (npm audit)
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the change's base lockfile is compared with this one
      - name: The change this run judges (its base and its head)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$(git rev-parse HEAD)}"
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main "$head" 2>/dev/null || true)" # a new branch: what main does not have
          fi
          if [ "$base" = "$head" ]; then
            base="$(git rev-parse --verify --quiet "$head^" || true)"
          fi
          echo "CHANGE_BASE=$base" >> "$GITHUB_ENV"
          echo "This run judges ${base:-the whole history}..$head"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Known advisories in the libraries; a high one in a library this change added or moved fails
        run: |
          # The canary: a library version known to carry a high advisory must come back high, or a
          # clean audit proves nothing.
          canary="$RUNNER_TEMP/audit-canary"
          mkdir -p "$canary"
          (cd "$canary" && npm init -y > /dev/null && npm install --package-lock-only --ignore-scripts --no-audit --no-fund lodash@4.17.20 > /dev/null)
          (cd "$canary" && npm audit --json > audit.json) || true
          npm audit --json > "$RUNNER_TEMP/audit.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/audit-shipped.json" || true
          base=()
          if [ -n "$CHANGE_BASE" ] && ! git diff --quiet "$CHANGE_BASE" HEAD -- package.json package-lock.json; then
            git show "$CHANGE_BASE:package-lock.json" > "$RUNNER_TEMP/base-lock.json"
            base=(--base-lock "$RUNNER_TEMP/base-lock.json")
          fi
          node scripts/ci/libraryAudit.mjs --audit "$RUNNER_TEMP/audit.json" --shipped-audit "$RUNNER_TEMP/audit-shipped.json" \
            --lock package-lock.json --canary-audit "$canary/audit.json" --canary-package lodash "${base[@]}"

  # The REAL app, driven over WebDriver: tauri-driver and an Edge WebDriver matching the runner's WebView2. Two lanes,
  # neither of which any other job runs: the WebdriverIO specs (`npm run e2e:desktop`, e2e/desktop/*.spec.mjs) and the
  # timed node lanes (e2e/desktop/**/*.desktop.mjs that import e2e/lib/timing, e.g. app start and a short export).
  # The dev build loads its page from vite with the sign-in bypass, pointed at a stand-in service that answers only the
  # app's build check (scripts/qa/standInServer.mjs), so no request can reach a real server. The times are only
  # REPORTED against e2e/timing-budgets.json (CI makes the compare report-only): GitHub's machines are too uneven to
  # block on; the lab PC's nightly run is the check.
  desktop-e2e:
    name: real app over WebDriver, with timings (windows)
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      ARTDADDY_TIMING_FILE: ${{ github.workspace }}\reports\qa\timing\desktop.jsonl
      # A cold dev server takes far longer than the lanes' default 40 s to bring the app up the first time.
      ARTDADDY_E2E_TIMEOUT_MS: "180000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # build.rs checks that every sidecar and resource exists, as in the `desktop` job above.
      - name: fetch sidecars
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run fetch:sidecars
      - run: npm run build:sidecar
      - run: npm run build:mcpb
      - run: npm run bundle:browser
      - name: build the dev app (debug; it loads its page from the dev server)
        run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - name: tauri-driver
        run: cargo install tauri-driver --locked
      - name: an Edge WebDriver matching the runner's WebView2
        shell: pwsh
        run: |
          $driver = & ./scripts/qa/edgeDriver.ps1 -Candidate "$env:EdgeWebDriver\msedgedriver.exe" -Cache "$env:RUNNER_TEMP\msedgedriver"
          "MSEDGEDRIVER=$driver" >> $env:GITHUB_ENV
      # Kept out of the lockfile, like Playwright in the browser job: only this lane uses it.
      - name: WebdriverIO
        run: npm i --no-save @wdio/cli@9 @wdio/local-runner@9 @wdio/mocha-framework@9 @wdio/spec-reporter@9
      # GitHub's Windows runners are elevated, and an elevated WebView2 ignores WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS,
      # which the Edge WebDriver opens the app's debugging port with ("DevToolsActivePort file doesn't exist"); HKLM
      # policy reaches it. So the port is set here with the app's own arguments, which the policy replaces
      # (policyBrowserArgs; a longer value holding the driver's switches too was ignored whole), and the lanes start the
      # app and attach to it, each launch on a fresh profile (e2e/desktop/webdriver.mjs launchForAttach).
      - name: open the app's WebView2 debugging port through policy (the runner is elevated)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $exe = $(if ($conf.PSObject.Properties['mainBinaryName'] -and $conf.mainBinaryName) { $conf.mainBinaryName } else { $conf.productName }) + '.exe'
          $browserArgs = node --input-type=module -e "const m = await import('./e2e/desktop/webdriver.mjs'); console.log(m.policyBrowserArgs(9223));"
          if ($LASTEXITCODE -ne 0 -or -not $browserArgs) { throw 'could not work out the WebView2 arguments' }
          "WebView2 arguments for $($exe): $browserArgs"
          reg add "HKLM\SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments" /v $exe /t REG_SZ /d "$browserArgs" /f
          "ARTDADDY_WEBVIEW2_DEBUG_PORT=9223" >> $env:GITHUB_ENV
      # The page (vite on 5173) and the stand-in service (8790) start in the step that uses them. Started in a step of
      # their own, they were not running when the app loaded its page ("localhost refused to connect"; the job's orphan
      # cleanup found neither). vite listens on both loopbacks (::, dual-stack), whichever one localhost becomes here.
      - name: the real app (npm run e2e:desktop, then the timed lanes)
        shell: pwsh
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8790
          VITE_E2E_AUTH_BYPASS: "1"
          VITE_SENTRY_DSN: ""
        run: |
          $service = Start-Process -FilePath node -PassThru -ArgumentList 'scripts/qa/standInServer.mjs', '--port', '8790', '--log', "$env:RUNNER_TEMP\service.log" `
            -RedirectStandardOutput "$env:RUNNER_TEMP\service.out.log" -RedirectStandardError "$env:RUNNER_TEMP\service.err.log"
          $vite = Start-Process -FilePath node -PassThru -ArgumentList 'node_modules/vite/bin/vite.js', '--host', '::', '--port', '5173', '--strictPort' `
            -RedirectStandardOutput "$env:RUNNER_TEMP\vite.log" -RedirectStandardError "$env:RUNNER_TEMP\vite.err.log"
          $served = $false
          for ($i = 0; $i -lt 120 -and -not $served; $i++) {
            try { $served = (Invoke-WebRequest http://127.0.0.1:5173/ -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $served) { throw 'vite did not serve http://127.0.0.1:5173 within 2 minutes' }
          foreach ($url in 'http://127.0.0.1:5173/', 'http://[::1]:5173/', 'http://127.0.0.1:8790/') {
            try { $code = (Invoke-WebRequest $url -UseBasicParsing -TimeoutSec 5 -SkipHttpErrorCheck).StatusCode } catch { $code = $_.Exception.Message }
            "$url -> $code"
          }
          "localhost is $([System.Net.Dns]::GetHostAddresses('localhost') -join ', ')"
          npm run e2e:desktop
          $wdio = $LASTEXITCODE
          node scripts/qa/timingBudgets.mjs run --lanes desktop --runs 1
          $lanes = $LASTEXITCODE
          Stop-Process -Id $vite.Id, $service.Id -ErrorAction SilentlyContinue
          if ($wdio -ne 0 -or $lanes -ne 0) { throw "npm run e2e:desktop exited $wdio; the timed lanes exited $lanes" }
      - name: times against the lab budgets (report only)
        if: always()
        shell: pwsh
        run: |
          node scripts/qa/timingBudgets.mjs compare $env:ARTDADDY_TIMING_FILE --report reports/qa/timing/report.txt
          if (Test-Path reports/qa/timing/report.txt) {
            '```' >> $env:GITHUB_STEP_SUMMARY
            Get-Content reports/qa/timing/report.txt >> $env:GITHUB_STEP_SUMMARY
            '```' >> $env:GITHUB_STEP_SUMMARY
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-timing-windows-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            reports/qa/timing/**
            ${{ runner.temp }}/vite*.log
            ${{ runner.temp }}/service*.log
          if-no-files-found: warn
          retention-days: 14
