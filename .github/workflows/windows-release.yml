name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the NSIS installer to this version's GitHub release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: https://akaru-server.ambitioustree-4d826744.centralindia.azurecontainerapps.io
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run fetch:sidecars
      - run: npm run build:sidecar
      - run: npm run build:mcpb
      - run: npm run bundle:browser

      - name: Build unsigned NSIS installer
        shell: pwsh
        run: |
          # Tauri writes the complete NSIS installer before it attempts updater signing. This
          # repository has the updater PUBLIC key but no private-key secret, so that final signing
          # phase exits 1 after the usable installer already exists. Accept only that exact failure
          # and only when one substantial installer was produced; every earlier build/bundle error
          # still fails this step.
          & npx tauri build --bundles nsis 2>&1 | Tee-Object -Variable buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue)
            $expectedSigningFailure = (($buildLog -join "`n") -match "public key.*no private key")
            $completeInstaller = $files.Count -eq 1 -and $files[0].Length -ge 100MB
            if ($expectedSigningFailure -and $completeInstaller) {
              Write-Host "::warning::updater signing is unavailable; continuing with the complete unsigned NSIS installer"
              exit 0
            }
            exit $buildExit
          }

      - name: Verify installer and production configuration
        id: verify
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($files.Count -ne 1) {
            Write-Host "::error::expected one NSIS installer, found $($files.Count)"
            $files | Format-Table FullName, Length
            exit 1
          }
          $installer = $files[0]
          if ($installer.Length -lt 100MB) {
            Write-Host "::error::installer is unexpectedly small: $($installer.Length) bytes"
            exit 1
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($installer.Name -notmatch [regex]::Escape($version)) {
            Write-Host "::error::installer $($installer.Name) does not carry version $version"
            exit 1
          }
          if (-not $env:VITE_API_BASE_URL) {
            Write-Host "::error::VITE_API_BASE_URL is empty"
            exit 1
          }
          $foundApi = Get-ChildItem dist/assets/*.js | Select-String -SimpleMatch $env:VITE_API_BASE_URL
          if (-not $foundApi) {
            Write-Host "::error::production backend URL is absent from the built bundle"
            exit 1
          }
          $asset = Join-Path $env:RUNNER_TEMP "ArtDaddy-windows-x64-setup.exe"
          Copy-Item $installer.FullName $asset
          "path=$asset" >> $env:GITHUB_OUTPUT
          "size=$($installer.Length)" >> $env:GITHUB_OUTPUT
          Get-FileHash $asset -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: artdaddy-windows-x64-unsigned
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error

      - name: Publish installer to the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::release $tag does not exist"
            exit 1
          }
          $asset = "${{ steps.verify.outputs.path }}"
          gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/ArtDaddy-windows-x64-setup.exe"
          $response = Invoke-WebRequest -UseBasicParsing -Method Head $url
          if ($response.StatusCode -ne 200) {
            Write-Host "::error::published URL returned $($response.StatusCode)"
            exit 1
          }
          if ([int64]$response.Headers.'Content-Length' -ne [int64]"${{ steps.verify.outputs.size }}") {
            Write-Host "::error::published size does not match the built installer"
            exit 1
          }
