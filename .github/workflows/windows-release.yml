name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Attach the NSIS installer to this version's GitHub release"
        type: boolean
        default: false
      enable_auto_update:
        description: "Produce signed auto-update artifacts (needs the TAURI_SIGNING_PRIVATE_KEY secret)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VITE_API_BASE_URL: https://akaru-server.ambitioustree-4d826744.centralindia.azurecontainerapps.io
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run fetch:sidecars
      - run: npm run build:sidecar
      - run: npm run build:mcpb
      - run: npm run bundle:browser

      - name: Build the NSIS installer
        shell: pwsh
        env:
          # The UPDATER key (minisign), not an Authenticode certificate. Its public half is baked
          # into every shipped app; without the private half tauri writes the installer and then
          # exits 1 on the signing phase, which this step used to SWALLOW - shipping installers
          # that no client could ever be offered as an update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ inputs.enable_auto_update }}" -eq "true" -and -not $env:TAURI_SIGNING_PRIVATE_KEY) {
            Write-Host "::error::auto-update needs the TAURI_SIGNING_PRIVATE_KEY repository secret"
            exit 1
          }
          & npx tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The signature is the whole point of signing, so assert the FILE rather than the exit code.
      # A tauri build that cannot sign still leaves a perfectly convincing installer behind.
      - name: The updater signature must exist
        id: updater
        if: inputs.enable_auto_update
        shell: pwsh
        run: |
          $sig = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe.sig" -ErrorAction SilentlyContinue)
          if ($sig.Count -ne 1 -or $sig[0].Length -eq 0) {
            Write-Host "::error::expected exactly one non-empty .exe.sig, found $($sig.Count)"
            exit 1
          }
          Write-Host "  sig: $($sig[0].Name) ($($sig[0].Length) bytes)"
          Write-Host "  signature: $(Get-Content $sig[0].FullName -Raw)"
          "path=$($sig[0].FullName)" >> $env:GITHUB_OUTPUT

      - name: Verify installer and production configuration
        id: verify
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe")
          if ($files.Count -ne 1) {
            Write-Host "::error::expected one NSIS installer, found $($files.Count)"
            $files | Format-Table FullName, Length
            exit 1
          }
          $installer = $files[0]
          if ($installer.Length -lt 100MB) {
            Write-Host "::error::installer is unexpectedly small: $($installer.Length) bytes"
            exit 1
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($installer.Name -notmatch [regex]::Escape($version)) {
            Write-Host "::error::installer $($installer.Name) does not carry version $version"
            exit 1
          }
          if (-not $env:VITE_API_BASE_URL) {
            Write-Host "::error::VITE_API_BASE_URL is empty"
            exit 1
          }
          $foundApi = Get-ChildItem dist/assets/*.js | Select-String -SimpleMatch $env:VITE_API_BASE_URL
          if (-not $foundApi) {
            Write-Host "::error::production backend URL is absent from the built bundle"
            exit 1
          }
          $asset = Join-Path $env:RUNNER_TEMP "ArtDaddy-windows-x64-setup.exe"
          Copy-Item $installer.FullName $asset
          "path=$asset" >> $env:GITHUB_OUTPUT
          "size=$($installer.Length)" >> $env:GITHUB_OUTPUT
          Get-FileHash $asset -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: artdaddy-windows-x64
          path: ${{ steps.verify.outputs.path }}
          if-no-files-found: error

      - name: Publish installer to the GitHub release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::release $tag does not exist"
            exit 1
          }
          $asset = "${{ steps.verify.outputs.path }}"
          gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/ArtDaddy-windows-x64-setup.exe"
          $response = Invoke-WebRequest -UseBasicParsing -Method Head $url
          if ($response.StatusCode -ne 200) {
            Write-Host "::error::published URL returned $($response.StatusCode)"
            exit 1
          }
          if ([int64]$response.Headers.'Content-Length' -ne [int64]"${{ steps.verify.outputs.size }}") {
            Write-Host "::error::published size does not match the built installer"
            exit 1
          }

          # The .sig is what an installed client verifies before replacing itself. Uploaded under
          # the same version-less name the manifest will point at.
          if ("${{ inputs.enable_auto_update }}" -eq "true") {
            $sigAsset = Join-Path $env:RUNNER_TEMP "ArtDaddy-windows-x64-setup.exe.sig"
            Copy-Item "${{ steps.updater.outputs.path }}" $sigAsset
            gh release upload $tag $sigAsset --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit 1 }
            Write-Host "::notice::signature published. It is inert until latest.json advertises it:"
            Write-Host "::notice::  npm run update:platform -- windows-x86_64 $version <path-to>.exe.sig"
          }
