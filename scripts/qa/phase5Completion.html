<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Isolated Phase 5 QA</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import { MemoryRouter } from "react-router-dom";
      import ChatView from "/src/components/ChatView.tsx";
      import ProfilePage from "/src/components/ProfilePage.tsx";
      import { getUsage, refreshUsage } from "/src/api/usage.ts";
      import { setApiBase } from "/src/api/config.ts";
      import { setClerkTokenProvider } from "/src/api/auth.ts";
      import { useAuth } from "/src/store/auth.ts";
      import { MemFs, registerTestDocument } from "/src/test/timelineKit.ts";
      import { ProjectStoreAccess, joinPath } from "/src/tools/store.ts";
      import { submitGeneration, whenGenerationsSettle } from "/src/tools/genJobs.ts";
      import { pendingJobNotes } from "/src/store/jobNotes.ts";
      import { VideoSource } from "/src/preview/videoSource.ts";
      import "/src/index.css";

      setApiBase("http://phase5.invalid");
      setClerkTokenProvider(async () => "isolated-qa");
      useAuth.setState({
        status: "unlocked",
        profile: {
          user_id: "isolated-qa",
          metered: true,
          display_name: "Phase 5 QA",
          email: "qa@example.invalid",
          image_url: "",
        },
      });
      const root = createRoot(document.getElementById("root"));
      const show = (view) =>
        root.render(
          React.createElement(
            MemoryRouter,
            null,
            React.createElement(view === "profile" ? ProfilePage : ChatView),
          ),
        );
      class MediaFs extends MemFs {
        bytes = new Map();
        async exists(file) {
          return this.bytes.has(joinPath(file)) || super.exists(file);
        }
        async readBytes(file) {
          const bytes = this.bytes.get(joinPath(file));
          if (!bytes) throw new Error("No generated bytes");
          return bytes;
        }
        async writeBytes(file, bytes) {
          this.bytes.set(joinPath(file), bytes);
        }
        async remove(file) {
          this.bytes.delete(joinPath(file));
          this.files.delete(joinPath(file));
        }
        async readDir() {
          return [];
        }
      }
      const definitions = {
        generate_image: { kind: "image", file: "completion.png" },
        generate_video: { kind: "video", file: "completion.mp4" },
        generate_music: { kind: "audio", file: "completion.wav" },
        generate_voiceover: { kind: "audio", file: "completion.wav" },
      };
      let job;
      async function startGeneration(tool) {
        const definition = definitions[tool];
        const response = await fetch(`/reports/qa/phase5/completion-live/media/${definition.file}`);
        if (!response.ok) throw new Error("No synthetic provider fixture");
        const bytes = new Uint8Array(await response.arrayBuffer());
        const fs = new MediaFs();
        const store = new ProjectStoreAccess(
          `C:/phase5_qa/qa_${crypto.randomUUID().replaceAll("-", "")}`,
          fs,
        );
        const doc = registerTestDocument(store.projectDir);
        await doc.open();
        let resolve, reject;
        const provider = new Promise((finish, fail) => {
          resolve = finish;
          reject = fail;
        });
        job = { fs, store, doc, definition, bytes, resolve, reject, providerRuns: 0 };
        const submission = await submitGeneration({
          store,
          tool,
          label: "synthetic media",
          mediaKind: definition.kind,
          count: 1,
          filename: () => definition.file,
          run: () => {
            job.providerRuns++;
            return provider;
          },
        });
        job.submission = submission;
        return submission;
      }
      const digest = async (bytes) =>
        [...new Uint8Array(await crypto.subtle.digest("SHA-256", bytes))]
          .map((value) => value.toString(16).padStart(2, "0"))
          .join("");
      async function completeGeneration(outcome) {
        if (outcome === "done") job.resolve([{ bytes: job.bytes }]);
        else job.reject(new Error("Synthetic provider rejection"));
        await whenGenerationsSettle();
        const catalog = await job.store.listClips();
        const ledger = JSON.parse(
          await job.fs.readTextFile(joinPath(job.store.projectDir, "internals/jobs.json")),
        );
        const result = {
          status: ledger.jobs.find((entry) => entry.id === job.submission.job_id)?.status,
          catalogStatus: catalog[0]?.status ?? "ready",
          providerRuns: job.providerRuns,
          unrelatedChatNotes: pendingJobNotes(job.store.projectDir).length,
        };
        if (outcome === "done") {
          const file = await job.store.resolveRef(job.submission.media_refs[0]);
          const bytes = await job.fs.readBytes(file);
          result.sha256 = await digest(bytes);
          const url = URL.createObjectURL(new Blob([bytes]));
          try {
            if (job.definition.kind === "image") {
              const picture = await createImageBitmap(new Blob([bytes]));
              result.dimensions = [picture.width, picture.height];
              picture.close();
            } else if (job.definition.kind === "video") {
              const source = new VideoSource(url);
              try {
                await source.whenReady();
                const hashes = [];
                for (const seconds of [0.2, 0.8]) {
                  const frame = await source.frameAt(seconds);
                  if (!frame) throw new Error("Generated video has no frame");
                  const canvas = document.createElement("canvas");
                  canvas.width = frame.displayWidth;
                  canvas.height = frame.displayHeight;
                  const context = canvas.getContext("2d");
                  context.drawImage(frame, 0, 0);
                  hashes.push(
                    await digest(context.getImageData(0, 0, canvas.width, canvas.height).data),
                  );
                }
                result.frameHashes = hashes;
              } finally {
                source.close();
              }
            } else {
              const context = new OfflineAudioContext(1, 48000, 48000);
              const sound = await context.decodeAudioData(bytes.slice().buffer);
              result.sampleRate = sound.sampleRate;
              result.duration = sound.duration;
              result.peak = Math.max(...sound.getChannelData(0).slice(0, 48000).map(Math.abs));
            }
          } finally {
            URL.revokeObjectURL(url);
          }
        } else {
          result.bytesWritten = job.fs.bytes.size;
        }
        await job.doc.close();
        return result;
      }
      window.__phase5Credits = {
        show,
        refresh: refreshUsage,
        balance: () => ({ ...getUsage() }),
        startGeneration,
        completeGeneration,
      };
      show("chat");
    </script>
  </body>
</html>
