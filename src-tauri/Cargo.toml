[package]
name = "artdaddy"
version = "0.14.0"
description = "ArtDaddy desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "artdaddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux hand a deep link to a NEW process (argv), not the running one. Without this the
# auth callback lands in a fresh instance that has no pending PKCE attempt, and sign-in can never
# complete. The `deep-link` feature forwards the URL to the deep-link plugin's listeners.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
trash = "5"
sha2 = "0.10"
keyring = "4"

# Desktop-only: there is no updater on mobile, and the plugin doesn't build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
