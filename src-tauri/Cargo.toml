[package]
name = "artdaddy"
version = "0.21.8"
description = "ArtDaddy desktop app"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "artdaddy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
cc = "1"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
# Windows/Linux hand a deep link to a NEW process (argv), not the running one. Without this the
# auth callback lands in a fresh instance that has no pending PKCE attempt, and sign-in can never
# complete. The `deep-link` feature forwards the URL to the deep-link plugin's listeners.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
trash = "5"
sha2 = "0.10"
same-file = "1.0.6"
shared_child = "=1.1.1"
sysinfo = { version = "=0.30.13", default-features = false }
keyring = "4"
# The sidecar runner's progress timer (sidecar_run.rs). Already in the lock through tauri and the
# shell plugin, which uses the same timer, so nothing new is fetched.
tokio = { version = "1", features = ["time"] }

# Tests only. The fs capability is a list of GLOBS, and whether one of them actually matches a
# path on a second drive is not something reading the JSON can answer — a project on D:\ failed
# every read for a real user while the file looked correct. Pinned to the version tauri itself
# resolves so the test evaluates the same matcher the app does.
[dev-dependencies]
glob = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Desktop-only: there is no updater on mobile, and the plugin doesn't build there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

# getrlimit/setrlimit (fdlimit.rs). Already in the lock through tauri, so nothing new is fetched.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# WebView2's ProcessFailed event (reload_guard.rs): the one signal that the page's renderer died, so
# the reload that recovers it is let through. Already in the lock through wry; the same version.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-sys = { version = "=0.60.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[profile.dev.package.sha2]
opt-level = 3
